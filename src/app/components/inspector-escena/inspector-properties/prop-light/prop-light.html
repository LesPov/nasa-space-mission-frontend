
<div class="section-card">
  <div class="section-head">
    <h4>Propiedades de la Luz</h4>
  </div>

  <div style="padding: 12px;">
    <div class="grid-2" style="margin-bottom: 15px;">
      <div class="checkbox-modern" style="border-color: #facc15; background: rgba(250, 204, 21, 0.1);">
        <input type="checkbox" id="chkLightEnabled" [(ngModel)]="enabled" (ngModelChange)="aplicarLuz()" style="accent-color: #facc15;">
        <label for="chkLightEnabled" style="color: #facc15;">💡 Encendida</label>
      </div>
      <div class="checkbox-modern" style="border-color: #60a5fa; background: rgba(96, 165, 250, 0.1);">
        <input type="checkbox" id="chkCastShadows" [(ngModel)]="castShadows" (ngModelChange)="aplicarLuz()">
        <label for="chkCastShadows" style="color: #60a5fa;">🌑 Sombras</label>
      </div>
    </div>

    <div class="grid-2" style="margin-bottom: 15px;">
      <div class="field">
        <label>Color Normal</label>
        <div class="color-box-modern">
          <input type="color" [(ngModel)]="lightColor" (ngModelChange)="aplicarLuz()" class="color-swatch-input">
          <span class="hex-text">{{ lightColor.toUpperCase() }}</span>
        </div>
      </div>
      <div class="field">
        <label>Color B&N</label>
        <div class="color-box-modern">
          <input type="color" [(ngModel)]="lightColorBW" (ngModelChange)="aplicarLuz()" class="color-swatch-input">
          <span class="hex-text">{{ lightColorBW.toUpperCase() }}</span>
        </div>
      </div>
    </div>

    <div class="field wide" *ngIf="childNodes.length > 0" style="margin-bottom: 15px; padding: 10px; border: 1px solid #334155; border-radius: 6px; background: rgba(59, 130, 246, 0.05);">
      <label style="color: #60a5fa;">🔗 Atar Luz a Hueso/Pieza:</label>
      <select [(ngModel)]="attachedNodePath" (ngModelChange)="aplicarLuz()" style="margin-top: 6px;">
        <option value="">-- Suelo / Centro (Estático) --</option>
        <option *ngFor="let node of childNodes" [value]="node.value">🦴 {{ node.label }}</option>
      </select>
      <p class="help-text">Si pegas la luz al nodo correcto, viajará con la animación.</p>
    </div>

    <div class="section-mini-head">
      <h5>Ajuste Fino de Posición Local</h5>
    </div>
    <div class="grid-3" style="margin-bottom: 15px;">
      <div class="field"><label>Loc X</label><input type="number" step="0.1" [(ngModel)]="lightPosX" (ngModelChange)="aplicarLuz()" /></div>
      <div class="field"><label>Loc Y</label><input type="number" step="0.1" [(ngModel)]="lightPosY" (ngModelChange)="aplicarLuz()" /></div>
      <div class="field"><label>Loc Z</label><input type="number" step="0.1" [(ngModel)]="lightPosZ" (ngModelChange)="aplicarLuz()" /></div>
    </div>

    <div class="section-mini-head" *ngIf="isSpot || isDirectional">
      <h5>Dirección Local (Grados)</h5>
    </div>
    <div class="grid-3" style="margin-bottom: 15px;" *ngIf="isSpot || isDirectional">
      <div class="field"><label>Pitch (X)</label><input type="number" step="5" [(ngModel)]="lightRotX" (ngModelChange)="aplicarLuz()" /></div>
      <div class="field"><label>Yaw (Y)</label><input type="number" step="5" [(ngModel)]="lightRotY" (ngModelChange)="aplicarLuz()" /></div>
      <div class="field"><label>Roll (Z)</label><input type="number" step="5" [(ngModel)]="lightRotZ" (ngModelChange)="aplicarLuz()" /></div>
    </div>

    <div class="grid-2">
      <div class="field wide">
        <label>Intensidad</label>
        <input type="number" step="0.1" min="0" [(ngModel)]="intensity" (ngModelChange)="aplicarLuz()" />
      </div>

      <div class="field wide" *ngIf="isPoint || isSpot">
        <label>Rango (Distancia)</label>
        <input type="number" step="1" min="0" [(ngModel)]="range" (ngModelChange)="aplicarLuz()" />
      </div>

      <div class="field wide" *ngIf="isSpot">
        <label>Apertura (Grados)</label>
        <input type="number" step="1" min="1" max="179" [(ngModel)]="angle" (ngModelChange)="aplicarLuz()" />
      </div>
    </div>
  </div>
</div>

<div class="status-line" *ngIf="animStatus">{{ animStatus }}</div>
