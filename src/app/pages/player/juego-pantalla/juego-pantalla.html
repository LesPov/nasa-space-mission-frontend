
<div class="juego-container">
  
  <app-ui-loading *ngIf="isLoading()" texto="Cargando Entorno 3D..."></app-ui-loading>

  <div class="canvas-wrapper" 
       [style.pointer-events]="(modalMisionUsuario && !cerrandoModalUsuario) ? 'none' : 'all'"
       (click)="onCanvasClick()">
     <div class="fps-badge" *ngIf="!isLoading()">FPS: {{ fps() }}</div>
     <app-motor-babylon></app-motor-babylon>
  </div>

  <app-ui-hud 
    playState="PLAYING" 
    [hideStatus]="modalMisionUsuario">
  </app-ui-hud>

  <!-- 🔥 EL MENÚ RADIAL EN INYECCIÓN DIRECTA -->
  <app-ui-radial-menu></app-ui-radial-menu>

  <app-ui-inspect (onClose)="cerrarInteraccion()"></app-ui-inspect>

  <app-ui-mission 
    *ngIf="modalMisionUsuario && !isLoading()" 
    [episodio]="episodioActual"
    [playerState]="playerStateActual"
    [misionIniciada]="misionIniciada" 
    [cerrando]="cerrandoModalUsuario" 
    [isDebugMode]="isAdmin && !isDetached" 
    (onStart)="comenzarMisionUsuario()" 
    (onExit)="salirDelJuego()">
  </app-ui-mission>

  <div class="sync-overlay" *ngIf="isSyncing()">
     <div class="sync-spinner"></div> Actualizando entorno en vivo...
  </div>

</div>
