<div class="section-card">
  <div class="section-head"><h4>Posición & Radio (Trigger)</h4></div>
  <div class="grid-3">
    <div class="field"><label>Pos X</label><input type="number" step="0.1" [ngModel]="localPosX" (ngModelChange)="localPosX = $event; aplicarPosicion()" /></div>
    <div class="field"><label>Pos Y</label><input type="number" step="0.1" [ngModel]="localPosY" (ngModelChange)="localPosY = $event; aplicarPosicion()" /></div>
    <div class="field"><label>Pos Z</label><input type="number" step="0.1" [ngModel]="localPosZ" (ngModelChange)="localPosZ = $event; aplicarPosicion()" /></div>
    <div class="field"><label>Radio X</label><input type="number" step="0.1" [ngModel]="localEscX" (ngModelChange)="localEscX = $event; aplicarEscala()" /></div>
    <div class="field"><label>Radio Y</label><input type="number" step="0.1" [ngModel]="localEscY" (ngModelChange)="localEscY = $event; aplicarEscala()" /></div>
    <div class="field"><label>Radio Z</label><input type="number" step="0.1" [ngModel]="localEscZ" (ngModelChange)="localEscZ = $event; aplicarEscala()" /></div>
  </div>
</div>

<div class="section-card" *ngIf="triggerIsComposite">
  <div class="section-head"><h4>Configuración Trigger Múltiple</h4></div>
  <div class="grid-2">
    <div class="field"><label>Forma</label><select [ngModel]="triggerShape" (ngModelChange)="triggerShape = $event; aplicarTriggerForma($event)"><option value="cube">Caja</option><option value="sphere">Esfera</option><option value="cylinder">Tubo</option></select></div>
    <div class="checkbox-field" style="margin-top: 15px;"><input type="checkbox" id="chkRepComp" [ngModel]="triggerRepeatable" (ngModelChange)="triggerRepeatable = $event; aplicarTrigger()" /><label for="chkRepComp">Es repetible</label></div>
  </div>
  <div style="margin-top: 15px;">
     <label style="font-size: 11px; color: #999;">¿Cuándo se activa?</label>
     <div class="grid-2" style="margin-top: 5px; margin-bottom: 10px;">
         <div class="checkbox-field"><input type="checkbox" id="condEnt" [checked]="triggerConditions.includes('on_enter')" (change)="toggleTriggerCondition('on_enter', $event)" /><label for="condEnt">Al Pisarlo</label></div>
         <div class="checkbox-field"><input type="checkbox" id="condExi" [checked]="triggerConditions.includes('on_exit')" (change)="toggleTriggerCondition('on_exit', $event)" /><label for="condExi">Al Salir</label></div>
     </div>

     <div *ngIf="triggerConditions.includes('on_enter')" style="margin-bottom: 15px; border-left: 2px solid #4ade80; padding-left: 8px;">
        <div class="grid-2">
          <div class="field wide"><label>Mensaje al ENTRAR</label><textarea rows="1" [ngModel]="triggerMensajeEntrada" (ngModelChange)="triggerMensajeEntrada = $event; aplicarTrigger()"></textarea></div>
          <div class="field"><label>Segundos</label><input type="number" step="0.5" [ngModel]="triggerTimeEntrada" (ngModelChange)="triggerTimeEntrada = $event; aplicarTrigger()" /></div>
          <div class="field"><label>ID Seq</label><input type="text" [ngModel]="triggerSeqEntrada" (ngModelChange)="triggerSeqEntrada = $event; aplicarTrigger()" /></div>
          <div class="field wide"><label>Audio URL</label><input type="text" [ngModel]="triggerSoundEntrada" (ngModelChange)="triggerSoundEntrada = $event; aplicarTrigger()" /></div>
          <div class="field wide"><label>Video (.mp4)</label><input type="text" [ngModel]="triggerVideoEntrada" (ngModelChange)="triggerVideoEntrada = $event; aplicarTrigger()" /></div>
        </div>
     </div>

     <div *ngIf="triggerConditions.includes('on_exit')" style="margin-bottom: 15px; border-left: 2px solid #f87171; padding-left: 8px;">
         <div class="grid-2">
          <div class="field wide"><label>Mensaje al SALIR</label><textarea rows="1" [ngModel]="triggerMensajeSalida" (ngModelChange)="triggerMensajeSalida = $event; aplicarTrigger()"></textarea></div>
          <div class="field"><label>Segundos</label><input type="number" step="0.5" [ngModel]="triggerTimeSalida" (ngModelChange)="triggerTimeSalida = $event; aplicarTrigger()" /></div>
          <div class="field"><label>ID Seq</label><input type="text" [ngModel]="triggerSeqSalida" (ngModelChange)="triggerSeqSalida = $event; aplicarTrigger()" /></div>
          <div class="field wide"><label>Audio URL</label><input type="text" [ngModel]="triggerSoundSalida" (ngModelChange)="triggerSoundSalida = $event; aplicarTrigger()" /></div>
          <div class="field wide"><label>Video (.mp4)</label><input type="text" [ngModel]="triggerVideoSalida" (ngModelChange)="triggerVideoSalida = $event; aplicarTrigger()" /></div>
        </div>
     </div>
  </div>
</div>

<div class="section-card" *ngIf="!triggerIsComposite">
  <div class="section-head"><h4>Trigger Normal</h4></div>
  <div class="grid-2">
    <div class="field"><label>Forma</label><select [ngModel]="triggerShape" (ngModelChange)="triggerShape = $event; aplicarTriggerForma($event)"><option value="cube">Caja</option><option value="sphere">Esfera</option><option value="cylinder">Tubo</option></select></div>
    <div class="field"><label>Condición</label><select [ngModel]="triggerCondition" (ngModelChange)="triggerCondition = $event; aplicarTrigger()"><option value="on_enter">Al Pisarlo</option><option value="on_exit">Al Salir</option></select></div>
    <div class="checkbox-field" style="margin-top: 15px;"><input type="checkbox" id="chkRepNorm" [ngModel]="triggerRepeatable" (ngModelChange)="triggerRepeatable = $event; aplicarTrigger()" /><label for="chkRepNorm">Es repetible</label></div>
  </div>
  <div class="field wide" style="margin-top: 10px;"><label>Mensaje</label><textarea rows="2" [ngModel]="objMensaje" (ngModelChange)="objMensaje = $event; aplicarTrigger()"></textarea></div>
  <div class="grid-2" style="margin-top: 5px;">
      <div class="field"><label>Segundos</label><input type="number" step="0.5" [ngModel]="triggerTimeNorm" (ngModelChange)="triggerTimeNorm = $event; aplicarTrigger()" /></div>
      <div class="field"><label>ID Seq</label><input type="text" [ngModel]="objInteractSequenceIdFPS" (ngModelChange)="objInteractSequenceIdFPS = $event; aplicarTrigger()" /></div>
      <div class="field wide"><label>Audio URL</label><input type="text" [ngModel]="objSoundUrl" (ngModelChange)="objSoundUrl = $event; aplicarTrigger()" /></div>
      <div class="field wide"><label>Video (.mp4)</label><input type="text" [ngModel]="triggerVideoNorm" (ngModelChange)="triggerVideoNorm = $event; aplicarTrigger()" /></div>
  </div>
</div>
<div class="status-line" *ngIf="animStatus">{{ animStatus }}</div>
