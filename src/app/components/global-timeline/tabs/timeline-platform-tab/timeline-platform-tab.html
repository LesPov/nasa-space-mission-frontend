
<div style="padding: 15px; display: flex; flex-direction: column; gap: 15px; height: 100%; overflow-y: auto;">
  <div style="background: rgba(59, 130, 246, 0.1); padding: 12px; border-radius: 6px; border: 1px solid #3b82f6;">
    <h4 style="margin: 0 0 10px 0; color: #60a5fa; font-size: 13px;">Reglas de la Plataforma Actual</h4>
    <p style="font-size: 11px; color: #cbd5e1; margin: 0 0 10px 0;">Define las condiciones iniciales para que el jugador empiece aquí. Además, los objetivos y recompensas de esta zona sobrescribirán los del episodio global.</p>
  </div>

  <div class="step-editor-grid">
    <div class="field wide" style="background: #242424; padding: 12px; border-radius: 6px; border: 1px solid #333;">
      <label style="color: #facc15; font-weight: bold; margin-bottom: 5px;">Variables Iniciales (Spawn)</label>
      <p style="font-size: 10px; color: #888; margin-bottom: 8px;">Estas variables se setean apenas el jugador entra a esta plataforma.</p>
      <div *ngFor="let cond of platformLogic.initialVariables; let i = index" style="display: flex; gap: 8px; margin-bottom: 6px;">
        <input type="text" [(ngModel)]="cond.key" (ngModelChange)="persistPlatformLogic()" placeholder="Clave (Ej: estado_luz)" style="flex: 1;">
        <input type="text" [(ngModel)]="cond.value" (ngModelChange)="persistPlatformLogic()" placeholder="Valor (Ej: true)" style="flex: 1;">
        <button class="btn-danger" (click)="quitarVariableInicial(i)">✕</button>
      </div>
      <button class="btn-secondary small" style="margin-top: 5px;" (click)="agregarVariableInicial()">+ Agregar Variable</button>
    </div>
    <div class="field wide" style="background: #242424; padding: 12px; border-radius: 6px; border: 1px solid #333;">
       <label style="color: #4ade80; font-weight: bold; margin-bottom: 5px;">Objetivos (Zona Local)</label>
       <textarea rows="3" [(ngModel)]="platformLogic.objetivosLocales" (ngModelChange)="persistPlatformLogic()" placeholder="Encuentra la forma de salir..."></textarea>
    </div>
    <div class="field wide" style="background: #242424; padding: 12px; border-radius: 6px; border: 1px solid #333;">
       <label style="color: #c084fc; font-weight: bold; margin-bottom: 5px;">Recompensas (Zona Local)</label>
       <textarea rows="3" [(ngModel)]="platformLogic.recompensasLocales" (ngModelChange)="persistPlatformLogic()" placeholder="Experiencia, Objetos..."></textarea>
    </div>
  </div>
</div>
