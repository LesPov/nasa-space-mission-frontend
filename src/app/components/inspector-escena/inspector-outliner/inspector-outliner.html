
<div class="panel-header">
  <div style="display: flex; align-items: center; gap: 6px;">
    <span class="icon">📁</span>
    <span>Outliner</span>
  </div>
  <input 
    type="text" 
    class="search-outliner" 
    placeholder="🔍 Buscar entidad..." 
    [ngModel]="outlinerState.searchTerm()" 
    (ngModelChange)="onSearchChange($event)">
</div>

<div class="platform-list">
  
  <ng-container *ngFor="let plat of plataformas; trackBy: trackById">
    
    <!-- Platform Header (Collapsible behavior driven by selection) -->
    <div class="platform-header" 
         [class.active]="plat.id === plataformaActivaId" 
         (click)="cambiarPlataforma(plat.id)">
      
      <div class="platform-info">
         <span class="icon">{{ plat.id === plataformaActivaId ? '▼' : '▶' }} 🌍</span>
         <span>{{ plat.name }}</span>
      </div>
      <span class="status-badge" *ngIf="plat.id === plataformaActivaId">ACTIVA</span>
    </div>

    <!-- Active Platform Content (Renders SceneOutliner) -->
    <div class="platform-content" *ngIf="plat.id === plataformaActivaId">
        <app-scene-outliner></app-scene-outliner>
    </div>

  </ng-container>

</div>
