<!-- file: src/app/components/inspector-escena/inspector-outliner/scene-outliner/scene-outliner.html -->
<ul [class.tree-items]="depth === 0">
  <li *ngFor="let node of filteredNodes; trackBy: trackById">
    
    <div class="outliner-item" 
         [class.selected]="isSelected(node)"
         [draggable]="isDraggable(node)"
         (dragstart)="onDragStart(node, $event)"
         (dragover)="onDragOver(node, $event)"
         (dragleave)="onDragLeave($event)"
         (drop)="onDrop(node, $event)"
         (dragend)="onDragEnd($event)"
         (click)="selectNode(node, $event)"
         (dblclick)="startEditing(node, $event)">
      
      <!-- Flecha de Expansión -->
      <button *ngIf="getUsefulChildren(node).length > 0 || hasColliderChild(node)" class="expand-btn" (click)="toggleExpand(node, $event)">
        <span class="arrow" [class.expanded]="isExpanded(node) || matchesSearch(node)">▶</span>
      </button>
      <div *ngIf="getUsefulChildren(node).length === 0 && !hasColliderChild(node)" style="width: 20px; flex-shrink: 0;"></div>

      <span class="icon">{{ getIcon(node) }}</span>
      
      <!-- Display Name o Input -->
      <span class="name-text" *ngIf="editingNodeId !== node.uniqueId.toString()" [title]="getDisplayName(node)" [class.hidden]="!isNodeEffectivelyVisible(node)">
          {{ getDisplayName(node) }}
      </span>
      
      <input *ngIf="editingNodeId === node.uniqueId.toString()"
             type="text"
             [id]="'editInput_' + node.uniqueId"
             [(ngModel)]="editingName"
             (blur)="saveEdit(node)"
             (keydown)="handleKeyDown($event, node)"
             (click)="$event.stopPropagation()"
             class="inline-edit-input" />
             
      <!-- Controles Secundarios a la derecha (Ojo y Candado) -->
      <div class="node-actions" (click)="$event.stopPropagation()">
          <button class="action-btn" 
                  [class.off]="isNodeManuallyHidden(node)" 
                  [class.culled]="isNodeRuntimeCulled(node)"
                  (click)="toggleVisibility(node, $event)" 
                  [title]="getVisibilityTitle(node)">
              {{ getVisibilityIcon(node) }}
          </button>
          <button class="action-btn" [class.locked]="isNodeLocked(node)" (click)="toggleLock(node, $event)" [title]="isNodeLocked(node) ? 'Desbloquear' : 'Bloquear'">
              {{ isNodeLocked(node) ? '🔒' : '🔓' }}
          </button>
      </div>
    </div>

    <!-- Hijos Recursivos y Colisionador Seleccionable -->
    <ul *ngIf="(getUsefulChildren(node).length > 0 || hasColliderChild(node)) && (isExpanded(node) || matchesSearch(node))" style="list-style: none; padding-left: 14px; margin: 0;">
      
      <!-- SUB-ELEMENTO FÍSICO HIJO: CUERPO DE COLISIÓN -->
      <li *ngIf="hasColliderChild(node)">
        <div class="outliner-item" 
             [class.selected]="isColliderSelected(node)"
             (click)="selectCollider(node, $event)"
             style="color: #60a5fa;">
          <div style="width: 20px; flex-shrink: 0;"></div>
          <span class="icon">🛡️</span>
          <span class="name-text" title="Colisionador Físico editable">
            Collider ({{ getEntityForNode(node)?.collider?.type || 'box' }})
          </span>
          <span style="font-size: 8px; background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; border-radius: 3px; padding: 1px 4px; color: #93c5fd; margin-left: auto;">
            PHYSICS
          </span>
        </div>
      </li>

      <!-- Hijos de Malla / Entidades -->
      <app-scene-outliner *ngIf="getUsefulChildren(node).length > 0" 
                          [nodes]="getUsefulChildren(node)" 
                          [depth]="depth + 1">
      </app-scene-outliner>
    </ul>

  </li>
</ul>
