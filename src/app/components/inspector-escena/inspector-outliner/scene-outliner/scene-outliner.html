<ul [class.tree-items]="depth === 0">
  <li *ngFor="let node of filteredNodes; trackBy: trackById">
    
    <div class="outliner-item" 
         [class.selected]="isSelected(node)"
         (click)="selectNode(node, $event)"
         (dblclick)="startEditing(node, $event)">
      
      <!-- Lógica inteligente: Abre el nodo si el usuario lo solicita O si el buscador hizo match adentro -->
      <button *ngIf="getUsefulChildren(node).length > 0" class="expand-btn" (click)="toggleExpand(node, $event)">
        <span class="arrow" [class.expanded]="isExpanded(node) || matchesSearch(node)">▶</span>
      </button>
      <div *ngIf="getUsefulChildren(node).length === 0" style="width: 20px; flex-shrink: 0;"></div>

      <span class="icon">{{ getIcon(node) }}</span>
      
      <!-- Display Name or Input -->
      <span class="name-text" *ngIf="editingNodeId !== node.uniqueId.toString()" [title]="node.name">
          {{ getDisplayName(node) }}
      </span>
      
      <!-- Input inline con interceptor de eventos para partes -->
      <input *ngIf="editingNodeId === node.uniqueId.toString()"
             type="text"
             [id]="'editInput_' + node.uniqueId"
             [(ngModel)]="editingName"
             (blur)="saveEdit(node)"
             (keydown)="handleKeyDown($event, node)"
             (click)="$event.stopPropagation()"
             class="inline-edit-input" />
    </div>

    <!-- Recursive Children: Pasa de largo los Wrappers Técnicos mediante el getUsefulChildren -->
    <app-scene-outliner *ngIf="getUsefulChildren(node).length > 0 && (isExpanded(node) || matchesSearch(node))" 
                        [nodes]="getUsefulChildren(node)" 
                        [depth]="depth + 1">
    </app-scene-outliner>
  </li>
</ul>
