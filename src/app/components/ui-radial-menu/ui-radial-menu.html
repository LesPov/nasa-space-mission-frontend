
<!-- 🔥 FIX: Interceptamos mousedown y contextmenu para evitar que el canvas de Babylon se entere -->
<div class="radial-overlay" *ngIf="isOpen" 
     (mousedown)="$event.stopPropagation(); $event.preventDefault();"
     (contextmenu)="$event.stopPropagation(); $event.preventDefault();">
  
  <div class="radial-container">
    
    <!-- HUD Central de Información -->
    <div class="center-info">
      <div class="center-icon" *ngIf="hoveredItem">{{ hoveredItem.icon }}</div>
      <h3 *ngIf="hoveredItem">{{ hoveredItem.name }}</h3>
      <h3 *ngIf="!hoveredItem" style="color: #94a3b8;">Menú de Construcción</h3>
      
      <p *ngIf="hoveredItem && hoveredItem.type === 'group'" class="desc-badge blue">Abrir Categoría</p>
      <p *ngIf="hoveredItem && hoveredItem.type === 'asset'" class="desc-badge green">Equipar Objeto</p>
      <p *ngIf="hoveredItem && hoveredItem.type === 'action'" class="desc-badge gray">Atrás</p>
      
      <p *ngIf="!hoveredItem" style="margin-top: 10px;">Selecciona una categoría</p>
    </div>

    <!-- Items posicionados radialmente via JS Styles -->
    <!-- 🔥 FIX: Cambiado a mousedown para responder instantáneamente y bloquear el bubbling -->
    <div class="radial-item" *ngFor="let item of currentItems; let i = index" 
         [style.transform]="getItemTransform(i)"
         (mouseenter)="hoveredItem = item"
         (mouseleave)="hoveredItem = null"
         (mousedown)="handleItemClick(item, $event)">
      
      <div class="item-bg" 
           [style.transform]="getInverseRotation(i)"
           [class.is-group]="item.type === 'group'"
           [class.is-back]="item.type === 'action'">
         <span class="item-icon">{{ item.icon }}</span>
      </div>
      
      <div class="item-label" [style.transform]="getInverseRotation(i)">
        {{ item.name }}
      </div>

    </div>
  </div>

  <div class="controls-hint">
    <div class="hint"><kbd>Clic Izquierdo</kbd> Seleccionar</div>
    <div class="hint"><kbd>Clic Derecho</kbd> Cerrar / Desequipar</div>
  </div>

</div>
