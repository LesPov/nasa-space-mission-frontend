
<div class="section-card" style="padding: 12px; background: transparent; border: none;">
  <button class="btn-primary full" style="margin-bottom: 12px;" (click)="nuevaSecuencia()">+ Crear Secuencia Nueva</button>

  <div class="sequence-list">
    <button class="sequence-chip" *ngFor="let seq of sequences" [class.active]="seq.id === selectedSequenceId" (click)="selectedSequenceId = seq.id">
      🎞️ {{ seq.name }}
    </button>
  </div>

  <div class="sequence-editor" *ngIf="currentSequence; else noSeq">
    <div class="field wide" style="margin-bottom: 12px;">
      <label>Nombre de la Secuencia</label>
      <input type="text" [ngModel]="currentSequence.name" (ngModelChange)="currentSequence.name = $event; persist()" />
    </div>

    <!-- CAJA DE OPCIONES GLOBALES DE LA SECUENCIA -->
    <div class="field wide" style="margin-bottom: 12px; border: 1px solid #334155; padding: 10px; border-radius: 6px; background: #0f172a;">
      <div class="checkbox-modern" style="margin-bottom: 8px; border-color: transparent; background: transparent; padding: 0;">
        <input type="checkbox" id="seqAutoPlay" [ngModel]="currentSequence.autoPlay" (ngModelChange)="currentSequence.autoPlay = $event; persist()" />
        <label for="seqAutoPlay" style="color: #60a5fa;">▶️ Iniciar al arrancar nivel</label>
      </div>

      <div class="checkbox-modern" style="border-color: transparent; background: transparent; padding: 0;">
        <input type="checkbox" id="seqRepeatGlobal" [ngModel]="currentSequence.repeat" (ngModelChange)="currentSequence.repeat = $event; persist()" />
        <label for="seqRepeatGlobal" style="color: #4ade80;">🔁 Ejecutar en Bucle Infinito</label>
      </div>
    </div>

    <div class="field wide" style="margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between;">
      <label style="color: #60a5fa; margin: 0; font-size: 10px;">ID: {{ currentSequence.id }}</label>
      <button class="btn-secondary small" (click)="copiarId(currentSequence.id)">📋 Copiar ID</button>
    </div>

    <div class="grid-2" style="margin-bottom: 20px;">
      <button class="btn-primary" *ngIf="!esTrigger" (click)="probarSecuencia(currentSequence)">▶ Probar</button>
      <button class="btn-danger" (click)="eliminarSecuencia(currentSequence.id)">🗑️ Borrar</button>
    </div>

    <div class="section-mini-head">
      <h5>Línea de Tiempo (Pasos)</h5>
      <button class="btn-secondary small" (click)="agregarPaso(currentSequence)">+ Paso</button>
    </div>

    <div class="step-list">
      <div class="accordion-section" *ngFor="let step of currentSequence.steps; let i = index">
        <div class="accordion-header" style="cursor: default;">
          <h4>Paso {{ i + 1 }}</h4>
          <div class="step-actions-inline">
            <button (click)="moverPaso(currentSequence, i, -1)">↑</button>
            <button (click)="moverPaso(currentSequence, i, 1)">↓</button>
            <button (click)="quitarPaso(currentSequence, i)">✕</button>
          </div>
        </div>
        
        <div class="accordion-content">
          <div class="field wide" style="margin-bottom: 8px;">
            <label>Acción / Comportamiento</label>
            <select [ngModel]="step.action" (ngModelChange)="step.action = $event; persist()" style="border-color: #facc15;">
               <option *ngFor="let act of actionRows" [ngValue]="act.key">{{ act.label }}</option>
            </select>
          </div>
          
          <ng-container *ngIf="step.action === 'procMove' || step.action === 'procRotate'">
             <div class="grid-3" style="margin-bottom: 8px;">
               <div class="field"><label style="color:#60a5fa">Dist X</label><input type="number" step="0.5" [ngModel]="step.procX" (ngModelChange)="step.procX = $event; persist()" /></div>
               <div class="field"><label style="color:#4ade80">Dist Y</label><input type="number" step="0.5" [ngModel]="step.procY" (ngModelChange)="step.procY = $event; persist()" /></div>
               <div class="field"><label style="color:#f87171">Dist Z</label><input type="number" step="0.5" [ngModel]="step.procZ" (ngModelChange)="step.procZ = $event; persist()" /></div>
             </div>
          </ng-container>

          <div class="field wide" style="margin-bottom: 8px; padding: 8px; border: 1px solid #334155; border-radius: 6px; background: rgba(59, 130, 246, 0.05);" *ngIf="availableClips.length > 0 && step.action !== 'procMove' && step.action !== 'procRotate' && step.action !== 'stopBaked'">
            <label style="color: #60a5fa;">Animación 3D (Opcional):</label>
            <select [ngModel]="step.clipOverride" (ngModelChange)="step.clipOverride = $event; persist()" style="margin-top: 4px;">
              <option value="">-- Acción por Defecto --</option>
              <option *ngFor="let clip of availableClips" [value]="clip">🎬 {{ clip }}</option>
            </select>
          </div>

          <div class="grid-2" style="margin-bottom: 8px;">
            <div class="field"><label>Duración (ms)</label><input type="number" step="50" [ngModel]="step.durationMs" (ngModelChange)="step.durationMs = $event; persist()" /></div>
            <div class="field" *ngIf="step.action !== 'procMove' && step.action !== 'procRotate'"><label>Velocidad Anim.</label><input type="number" step="0.1" [ngModel]="step.speedRatio" (ngModelChange)="step.speedRatio = $event; persist()" /></div>
          </div>
          
          <div class="grid-2" *ngIf="esPersonaje" style="margin-bottom: 8px;">
            <div class="field"><label>Mover Z</label><input type="number" step="0.1" [ngModel]="step.offsetForward" (ngModelChange)="step.offsetForward = $event; persist()" /></div>
            <div class="field"><label>Mover Y</label><input type="number" step="0.1" [ngModel]="step.offsetY" (ngModelChange)="step.offsetY = $event; persist()" /></div>
          </div>

          <div class="grid-2" style="margin-top: 12px; border-top: 1px solid #334155; padding-top: 12px;">
              <div class="checkbox-modern"><input type="checkbox" id="chkLoop_{{i}}" [ngModel]="step.loop" (ngModelChange)="step.loop = $event; persist()" /><label for="chkLoop_{{i}}">Bucle Anim</label></div>
              <div class="checkbox-modern" *ngIf="esPersonaje"><input type="checkbox" id="chkLock_{{i}}" [ngModel]="step.lockInput" (ngModelChange)="step.lockInput = $event; persist()" /><label for="chkLock_{{i}}">Bloquear Jugador</label></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <ng-template #noSeq><div style="text-align: center; color: #64748b; font-size: 11px; padding: 20px;">Crea una secuencia para programar acciones automáticas.</div></ng-template>
</div>
<div class="status-line" *ngIf="animStatus">{{ animStatus }}</div>
