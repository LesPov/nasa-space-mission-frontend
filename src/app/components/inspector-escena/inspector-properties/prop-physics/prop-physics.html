<!-- file: src/app/components/inspector-escena/inspector-properties/prop-physics/prop-physics.html -->
<div class="section-card">
  <div class="section-head">
    <h4>Cuerpo de Colisión</h4>
    <button 
      class="btn-secondary small" 
      [class.active-gizmo]="estaEditandoColliderGizmo"
      (click)="toggleEditarColliderGizmo()" 
      title="Mover o rotar el collider con el Gizmo directamente en la escena 3D">
      {{ estaEditandoColliderGizmo ? '⏹ Salir Modo Gizmo' : '🎯 Mover Collider con Gizmo' }}
    </button>
  </div>
  
  <div style="padding: 12px;">
    <div class="field wide" style="margin-bottom: 12px;">
      <label>Tipo de Collider</label>
      <select [ngModel]="colliderType" (ngModelChange)="colliderType = $event; aplicarCollider()">
        <option value="capsule">Capsule (Personajes)</option>
        <option value="box">Box (Caja)</option>
        <option value="sphere">Sphere (Esfera)</option>
        <option value="cylinder">Cylinder (Cilindro)</option>
        <option value="mesh">Mesh exacto (Pesado / Modelos)</option>
      </select>
    </div>

    <!-- Dimensiones: solo aplican para primitivas paramétricas -->
    <div *ngIf="colliderType !== 'mesh'" class="grid-3" style="margin-bottom: 10px;">
      <div class="field"><label>Tam X</label><input type="number" step="0.1" [ngModel]="colliderSizeX" (ngModelChange)="colliderSizeX = $event; aplicarCollider()" /></div>
      <div class="field"><label>Tam Y</label><input type="number" step="0.1" [ngModel]="colliderSizeY" (ngModelChange)="colliderSizeY = $event; aplicarCollider()" /></div>
      <div class="field"><label>Tam Z</label><input type="number" step="0.1" [ngModel]="colliderSizeZ" (ngModelChange)="colliderSizeZ = $event; aplicarCollider()" /></div>
    </div>

    <!-- Posición / Offset del Collider: visible para TODOS los tipos de collider, incluido MESH -->
    <div class="section-mini-head">
      <h5>Posición Relativa / Offset del Collider</h5>
    </div>
    <div class="grid-3">
      <div class="field"><label>Off X</label><input type="number" step="0.05" [ngModel]="colliderOffX" (ngModelChange)="colliderOffX = $event; aplicarCollider()" /></div>
      <div class="field"><label>Off Y</label><input type="number" step="0.05" [ngModel]="colliderOffY" (ngModelChange)="colliderOffY = $event; aplicarCollider()" /></div>
      <div class="field"><label>Off Z</label><input type="number" step="0.05" [ngModel]="colliderOffZ" (ngModelChange)="colliderOffZ = $event; aplicarCollider()" /></div>
    </div>

    <div *ngIf="colliderType === 'mesh'" style="margin-top: 10px; background: rgba(59, 130, 246, 0.08); padding: 8px 10px; border-radius: 4px; border: 1px solid #334155;">
      <p style="font-size: 10px; color: #94a3b8; margin: 0; line-height: 1.4;">
        ℹ️ <b>Modo Mesh Exacto:</b> La malla blanca de colisión refleja los vértices reales del modelo. Puedes ajustar los valores de <b>Off X, Y, Z</b> o activar el botón de <b>Gizmo</b> arriba para calibrar su posición en vivo.
      </p>
    </div>
  </div>
</div>
