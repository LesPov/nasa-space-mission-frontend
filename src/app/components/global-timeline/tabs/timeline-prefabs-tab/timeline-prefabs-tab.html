
<div class="search-bar">
  <input type="text" placeholder="🔍 Buscar prefabs..." [(ngModel)]="searchQuery" (input)="onSearchChange($event)">
</div>

<div class="filters" *ngIf="!isSearching">
  <select [(ngModel)]="activeLibraryName" (change)="onLibraryChange()">
    <option *ngFor="let lib of libraries" [value]="lib.name">{{ lib.name }}</option>
  </select>
  <select [(ngModel)]="activeCollectionName" (change)="onCollectionChange()" *ngIf="activeLibrary">
    <option *ngFor="let col of activeLibrary.collections" [value]="col.name">{{ col.name }}</option>
  </select>
  <select [(ngModel)]="activeCategoryName" (change)="onCategoryChange()" *ngIf="activeCollection">
    <option *ngFor="let cat of activeCollection.categories" [value]="cat.name">{{ cat.name }} ({{ cat.items.length }})</option>
  </select>
</div>

<div class="grid-area">
  <div class="asset-card" 
       *ngFor="let item of displayItems" 
       [class.selected]="selectedItem === item"
       (click)="selectItem(item)">
    <div class="card-preview" [style.background-image]="item.thumbnailUrl && !item.type.startsWith('light_') ? 'url(http://localhost:4000' + item.thumbnailUrl + ')' : 'none'">
      <span class="card-icon" *ngIf="!item.thumbnailUrl || item.type.startsWith('light_')">{{ item.icon }}</span>
    </div>
    <div class="card-info">
      <div class="card-type">{{ item.displayType }}</div>
      <div class="card-name" [title]="item.name">{{ item.name }}</div>
    </div>
  </div>
  
  <div *ngIf="displayItems.length === 0" style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 20px; font-size: 11px; font-style: italic;">
    No se encontraron prefabs.
  </div>
</div>

<div class="selected-panel" *ngIf="selectedItem">
  <div class="selected-header">
    <h4 [title]="selectedItem.name">{{ selectedItem.name }}</h4>
    <button style="background: transparent; border: none; color: #94a3b8; cursor: pointer;" (click)="selectedItem = null">✕</button>
  </div>
  <p style="margin: 0; font-size: 10px; color: #94a3b8;">{{ selectedItem.displayType }} | ID: {{ selectedItem.id }}</p>
  <button class="btn-place" (click)="placeItem()">🔨 INSTANCIAR / COLOCAR</button>
</div>
