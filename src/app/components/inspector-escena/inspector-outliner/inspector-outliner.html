<!-- Encabezado fijo y buscador -->
<div class="panel-header">
  <div style="display: flex; align-items: center; gap: 6px;">
    <span class="icon">📁</span>
    <span>Outliner</span>
  </div>
  <input 
    type="text" 
    class="search-outliner" 
    placeholder="🔍 Buscar..." 
    [ngModel]="outlinerState.searchTerm()" 
    (ngModelChange)="onSearchChange($event)">
</div>

<!-- Contenedor scrolleable de las colecciones -->
<div class="platform-list">
  
  <ng-container *ngFor="let plat of plataformas; trackBy: trackById">
    
    <!-- NODO PADRE: LA COLECCIÓN / PLATAFORMA -->
    <div class="outliner-node platform-node" [class.active-scene]="plat.id === plataformaActivaId">
      <div class="node-content">
        <!-- Flecha de expansión -->
        <button class="expand-btn" (click)="toggleExpand(plat.id, $event)">
          <span class="arrow" [class.expanded]="isExpanded(plat.id)">▶</span>
        </button>
        
        <!-- Nombre de la colección -->
        <div class="node-label" (click)="cambiarPlataforma(plat.id)">
          <span class="icon">🌎</span>
          <span class="name" [title]="plat.name">{{ plat.name }}</span>
          <span class="badge" *ngIf="plat.id === plataformaActivaId">ACTIVA</span>
        </div>
      </div>
    </div>

    <!-- HIJOS: LOS OBJETOS DE LA COLECCIÓN (Indentados) -->
    <div class="outliner-children" *ngIf="isExpanded(plat.id)">
        
        <ng-container *ngIf="plat.id === plataformaActivaId">
           <app-scene-outliner class="scene-outliner-wrapper"></app-scene-outliner>
        </ng-container>

        <ng-container *ngIf="plat.id !== plataformaActivaId">
           <div class="empty-hint">
              <span class="icon">📦</span> 
              <span>Haz clic en el nombre de la plataforma para ver sus objetos.</span>
           </div>
        </ng-container>

    </div>

  </ng-container>

</div>
