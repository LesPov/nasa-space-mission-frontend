
<div class="admin-wrapper">
  
  <!-- Header fijo arriba (Se oculta en el modo editor 3D) -->
  <app-header-admin *ngIf="layoutSvc.menuVisible()"></app-header-admin>

  <!-- Menú lateral (Se oculta en el modo editor 3D) -->
  <app-navbar-admin *ngIf="layoutSvc.menuVisible()"></app-navbar-admin>

  <!-- CONTENIDO CENTRAL -->
  <!-- Si el menú NO es visible, le ponemos la clase 'pantalla-completa' -->
  <main class="admin-main-content" [class.pantalla-completa]="!layoutSvc.menuVisible()">
    <router-outlet></router-outlet>
  </main>

</div>
