

<div class="section-card">
  <div class="actions-row wrap">
    <button class="btn-primary" (click)="nuevaSecuencia()">+ Crear Secuencia Nueva</button>
  </div>

  <div class="sequence-list">
    <button class="sequence-chip" *ngFor="let seq of sequences" [class.active]="seq.id === selectedSequenceId" (click)="selectedSequenceId = seq.id">
      🎞️ {{ seq.name }}
    </button>
  </div>

  <div class="sequence-editor" *ngIf="currentSequence; else noSeq">
    <div class="field wide" style="margin-top: 10px;">
      <label>Nombre de la Secuencia</label>
      <input type="text" [ngModel]="currentSequence.name" (ngModelChange)="currentSequence.name = $event; persist()" />
    </div>

    <div class="field wide" style="margin-top: 10px; margin-bottom: 10px; border: 1px solid #4ade80; padding: 10px; border-radius: 4px; background: rgba(74, 222, 128, 0.1);">
      <div class="checkbox-field">
        <input type="checkbox" id="seqRepeatGlobal" [ngModel]="currentSequence.repeat" (ngModelChange)="currentSequence.repeat = $event; persist()" />
        <label for="seqRepeatGlobal" style="color: #4ade80; font-weight: bold; cursor: pointer;">🔁 Ejecutar esta secuencia en BUCLE INFINITO</label>
      </div>
    </div>

    <div class="field wide" style="margin-bottom: 10px; display: flex; align-items: center; gap: 10px;">
      <label style="color: #60a5fa; margin: 0; font-size: 10px;">ID: {{ currentSequence.id }}</label>
      <button class="btn-secondary small" (click)="copiarId(currentSequence.id)">📋 Copiar ID</button>
    </div>

    <div class="actions-row wrap">
      <button class="btn-primary" *ngIf="!esTrigger" (click)="probarSecuencia(currentSequence)">▶ Ver Prevista de Animación</button>
      <button class="btn-danger" (click)="eliminarSecuencia(currentSequence.id)">🗑️ Borrar Secuencia</button>
    </div>

    <div class="section-mini-head" style="margin-top: 15px;">
      <h5>Línea de Tiempo (Pasos)</h5>
      <button class="btn-secondary small" (click)="agregarPaso(currentSequence)">+ Añadir Paso</button>
    </div>

    <div class="step-list">
      <div class="accordion-section" *ngFor="let step of currentSequence.steps; let i = index" style="background: #242424; padding: 5px; border-radius: 6px; border: 1px solid #111; margin-bottom: 10px;">
        <div class="accordion-header" style="justify-content: space-between; cursor: default;">
          <div style="font-size: 12px; font-weight: bold; color: #ddd;">Paso {{ i + 1 }}</div>
          <div class="step-actions-inline">
            <button (click)="moverPaso(currentSequence, i, -1)">↑</button>
            <button (click)="moverPaso(currentSequence, i, 1)">↓</button>
            <button (click)="quitarPaso(currentSequence, i)">×</button>
          </div>
        </div>
        
        <div class="grid-step">
          <div class="field wide">
            <label>Acción / Comportamiento</label>
            <select [ngModel]="step.action" (ngModelChange)="step.action = $event; persist()" style="border: 1px solid #facc15;">
               <option *ngFor="let act of actionRows" [ngValue]="act.key">{{ act.label }}</option>
            </select>
          </div>
          
          <ng-container *ngIf="step.action === 'procMove' || step.action === 'procRotate'">
             <div class="field wide" style="margin-top: 5px;"><label style="color:#60a5fa">Distancia / Grados X</label><input type="number" step="0.5" [ngModel]="step.procX" (ngModelChange)="step.procX = $event; persist()" /></div>
             <div class="field wide"><label style="color:#4ade80">Distancia / Grados Y</label><input type="number" step="0.5" [ngModel]="step.procY" (ngModelChange)="step.procY = $event; persist()" /></div>
             <div class="field wide"><label style="color:#f87171">Distancia / Grados Z</label><input type="number" step="0.5" [ngModel]="step.procZ" (ngModelChange)="step.procZ = $event; persist()" /></div>
          </ng-container>

          <div class="field wide" style="margin-top: 5px; padding: 10px; border: 1px dashed #4b73b5; border-radius: 6px; background: rgba(75, 115, 181, 0.1);" *ngIf="availableClips.length > 0 && step.action !== 'procMove' && step.action !== 'procRotate' && step.action !== 'stopBaked'">
            <label style="color: #60a5fa; font-weight: bold;">Elegir Animación 3D (Opcional):</label>
            <select [ngModel]="step.clipOverride" (ngModelChange)="step.clipOverride = $event; persist()" style="margin-top: 5px; font-weight: bold;">
              <option value="">-- Usar Acción por Defecto --</option>
              <option *ngFor="let clip of availableClips" [value]="clip">🎬 {{ clip }}</option>
            </select>
          </div>

          <div class="field"><label>Duración del Paso (ms)</label><input type="number" step="50" [ngModel]="step.durationMs" (ngModelChange)="step.durationMs = $event; persist()" /></div>
          <div class="field" *ngIf="step.action !== 'procMove' && step.action !== 'procRotate'"><label>Velocidad Animación</label><input type="number" step="0.1" [ngModel]="step.speedRatio" (ngModelChange)="step.speedRatio = $event; persist()" /></div>
          
          <div class="field wide" *ngIf="esPersonaje"><label>Mover hacia Adelante (Distancia Z)</label><input type="number" step="0.1" [ngModel]="step.offsetForward" (ngModelChange)="step.offsetForward = $event; persist()" /></div>
          <div class="field wide" *ngIf="esPersonaje"><label>Elevar (Distancia Y)</label><input type="number" step="0.1" [ngModel]="step.offsetY" (ngModelChange)="step.offsetY = $event; persist()" /></div>
        </div>

        <div class="grid-3" style="margin-top: 10px; border-top: 1px dashed #333; padding-top: 10px;">
            <div class="checkbox-field"><input type="checkbox" id="chkLoop_{{i}}" [ngModel]="step.loop" (ngModelChange)="step.loop = $event; persist()" /><label for="chkLoop_{{i}}">Bucle Anim</label></div>
            <div class="checkbox-field" *ngIf="esPersonaje"><input type="checkbox" id="chkLock_{{i}}" [ngModel]="step.lockInput" (ngModelChange)="step.lockInput = $event; persist()" /><label for="chkLock_{{i}}">Bloquear Player</label></div>
        </div>
      </div>
    </div>
  </div>
  <ng-template #noSeq><div class="empty-state"><p>Crea una secuencia para programar acciones automáticas o cinemáticas.</p></div></ng-template>
</div>
<div class="status-line" *ngIf="animStatus">{{ animStatus }}</div>
