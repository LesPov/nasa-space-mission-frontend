
<div class="timeline-shell">
  <div class="timeline-tabs">
    <button class="tab-btn" [class.active]="stateSvc.activeBottomTab() === 'clips'" (click)="cambiarTab('clips')">🎬 Clips/Objetos</button>
    <button class="tab-btn" [class.active]="stateSvc.activeBottomTab() === 'animaciones'" (click)="cambiarTab('animaciones')">🏃 Anim. Auto</button>
    <button class="tab-btn" [class.active]="stateSvc.activeBottomTab() === 'director'" (click)="cambiarTab('director')">🎥 Director (Global)</button>
    <button class="tab-btn" [class.active]="stateSvc.activeBottomTab() === 'prefabs'" (click)="cambiarTab('prefabs')">📦 Prefabs</button>
    <button class="tab-btn" [class.active]="stateSvc.activeBottomTab() === 'roles'" (click)="cambiarTab('roles')">🎭 Roles Narrativos</button>
    <!-- 🔥 Lógica Plataforma ELIMINADA del Timeline -->
  </div>

  <div class="timeline-content">
     <app-timeline-clips-tab *ngIf="stateSvc.activeBottomTab() === 'clips'"></app-timeline-clips-tab>
     <app-timeline-auto-anim-tab *ngIf="stateSvc.activeBottomTab() === 'animaciones'"></app-timeline-auto-anim-tab>
     <app-timeline-director-tab *ngIf="stateSvc.activeBottomTab() === 'director'"></app-timeline-director-tab>
     <app-timeline-prefabs-tab *ngIf="stateSvc.activeBottomTab() === 'prefabs'"></app-timeline-prefabs-tab>
     <app-timeline-roles-tab *ngIf="stateSvc.activeBottomTab() === 'roles'"></app-timeline-roles-tab>
  </div>
</div>
