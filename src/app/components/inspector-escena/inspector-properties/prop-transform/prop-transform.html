<div class="section-card">
  <div class="section-head"><h4>Posición & Escala</h4></div>
  <div class="grid-3">
    <div class="field"><label>Pos X</label><input type="number" step="0.1" [ngModel]="localPosX" (ngModelChange)="localPosX = $event; aplicarPosicion()" /></div>
    <div class="field"><label>Pos Y</label><input type="number" step="0.1" [ngModel]="localPosY" (ngModelChange)="localPosY = $event; aplicarPosicion()" /></div>
    <div class="field"><label>Pos Z</label><input type="number" step="0.1" [ngModel]="localPosZ" (ngModelChange)="localPosZ = $event; aplicarPosicion()" /></div>
    
    <div class="field"><label>Rot X</label><input type="number" step="1" [ngModel]="localRotX" (ngModelChange)="localRotX = $event; aplicarRotacion()" /></div>
    <div class="field"><label>Rot Y</label><input type="number" step="1" [ngModel]="localRotY" (ngModelChange)="localRotY = $event; aplicarRotacion()" /></div>
    <div class="field"><label>Rot Z</label><input type="number" step="1" [ngModel]="localRotZ" (ngModelChange)="localRotZ = $event; aplicarRotacion()" /></div>

    <div class="field"><label>Escala X</label><input type="number" step="0.1" [ngModel]="localEscX" (ngModelChange)="localEscX = $event; aplicarEscala()" /></div>
    <div class="field"><label>Escala Y</label><input type="number" step="0.1" [ngModel]="localEscY" (ngModelChange)="localEscY = $event; aplicarEscala()" /></div>
    <div class="field"><label>Escala Z</label><input type="number" step="0.1" [ngModel]="localEscZ" (ngModelChange)="localEscZ = $event; aplicarEscala()" /></div>
  </div>
</div>

<div class="section-card">
  <div class="section-head">
    <h4>Interacción y Eventos</h4>
  </div>
  <div class="grid-2" style="margin-bottom: 10px;">
    <div class="field"><label>Dist. FPS</label><input type="number" step="0.5" [ngModel]="objInteractDistanceFPS" (ngModelChange)="objInteractDistanceFPS = $event; aplicarInteraccion()" /></div>
    <div class="field"><label>Dist. TPS</label><input type="number" step="0.5" [ngModel]="objInteractDistanceTPS" (ngModelChange)="objInteractDistanceTPS = $event; aplicarInteraccion()" /></div>
  </div>
  <div class="grid-2">
    <div class="field wide"><label>Mensaje (tecla I)</label><textarea rows="2" [ngModel]="objMensaje" (ngModelChange)="objMensaje = $event; aplicarInteraccion()"></textarea></div>
    <div class="field wide"><label>Ejecutar Seq. FPS</label><input type="text" [ngModel]="objInteractSequenceIdFPS" (ngModelChange)="objInteractSequenceIdFPS = $event; aplicarInteraccion()"/></div>
    <div class="field wide"><label>Ejecutar Seq. TPS</label><input type="text" [ngModel]="objInteractSequenceIdTPS" (ngModelChange)="objInteractSequenceIdTPS = $event; aplicarInteraccion()"/></div>
  </div>
</div>
<div class="status-line" *ngIf="animStatus">{{ animStatus }}</div>
