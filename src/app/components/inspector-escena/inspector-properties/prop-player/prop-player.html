<button class="btn-ghost small full" style="margin-bottom: 10px;" (click)="restaurarPlayerConfigDefault()">🔄 Reset a Valores de Fábrica</button>

<div class="accordion-section" [class.expanded]="acordeonesPlayer['movement']">
  <div class="accordion-header" (click)="toggleAcordeon('movement')"><h4>▶ Movimiento Base</h4></div>
  <div class="accordion-content" *ngIf="acordeonesPlayer['movement']">
    <div class="grid-2">
      <div class="field"><label>Vel. Caminar</label><input type="number" step="0.001" [ngModel]="playerConfig.movement.walkSpeed" (ngModelChange)="playerConfig.movement.walkSpeed = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Vel. Correr</label><input type="number" step="0.001" [ngModel]="playerConfig.movement.runSpeed" (ngModelChange)="playerConfig.movement.runSpeed = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Aceleración</label><input type="number" step="0.001" [ngModel]="playerConfig.movement.acceleration" (ngModelChange)="playerConfig.movement.acceleration = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Rotación</label><input type="number" step="0.001" [ngModel]="playerConfig.movement.rotationSpeed" (ngModelChange)="playerConfig.movement.rotationSpeed = $event; aplicarPlayerConfig()" /></div>
    </div>
  </div>
</div>

<div class="accordion-section" [class.expanded]="acordeonesPlayer['jump']">
  <div class="accordion-header" (click)="toggleAcordeon('jump')"><h4>▶ Salto y Gravedad</h4></div>
  <div class="accordion-content" *ngIf="acordeonesPlayer['jump']">
    <div class="grid-2">
      <div class="field"><label>Fuerza Salto</label><input type="number" step="0.001" [ngModel]="playerConfig.jump.force" (ngModelChange)="playerConfig.jump.force = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Gravedad Base</label><input type="number" step="0.001" [ngModel]="playerConfig.jump.gravity" (ngModelChange)="playerConfig.jump.gravity = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Caída Máx</label><input type="number" step="0.001" [ngModel]="playerConfig.jump.maxFallSpeed" (ngModelChange)="playerConfig.jump.maxFallSpeed = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Coyote Time</label><input type="number" step="0.01" [ngModel]="playerConfig.jump.coyoteTime" (ngModelChange)="playerConfig.jump.coyoteTime = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>T. Subida</label><input type="number" step="0.01" [ngModel]="playerConfig.jump.jumpRiseTime" (ngModelChange)="playerConfig.jump.jumpRiseTime = $event; aplicarPlayerConfig()" /></div>
    </div>
  </div>
</div>

<div class="accordion-section" [class.expanded]="acordeonesPlayer['camera']">
  <div class="accordion-header" (click)="toggleAcordeon('camera')"><h4>▶ Cámara</h4></div>
  <div class="accordion-content" *ngIf="acordeonesPlayer['camera']">
    <div class="grid-2">
      <div class="field"><label>Ojos (FPS Y)</label><input type="number" step="0.01" [ngModel]="playerConfig.camera.fpsEyeLevel" (ngModelChange)="playerConfig.camera.fpsEyeLevel = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Pivote (TPS Y)</label><input type="number" step="0.01" [ngModel]="playerConfig.camera.tpsPivotY" (ngModelChange)="playerConfig.camera.tpsPivotY = $event; aplicarPlayerConfig()" /></div>
      <div class="field"><label>Distancia TPS</label><input type="number" step="0.01" [ngModel]="playerConfig.camera.tpsRadius" (ngModelChange)="playerConfig.camera.tpsRadius = $event; aplicarPlayerConfig()" /></div>
    </div>
  </div>
</div>

<div class="accordion-section" [class.expanded]="acordeonesPlayer['animEnabled']">
  <div class="accordion-header" (click)="toggleAcordeon('animEnabled')"><h4>▶ Permitir Acciones (Toggles)</h4></div>
  <div class="accordion-content" *ngIf="acordeonesPlayer['animEnabled']">
    <div class="grid-2">
      <div class="field"><label>Idle</label><select [ngModel]="playerConfig.animationEnabled.idle" (ngModelChange)="cambiarHabilitadoAnim('idle', $event)"><option [ngValue]="true">Sí</option><option [ngValue]="false">No</option></select></div>
      <div class="field"><label>Walk</label><select [ngModel]="playerConfig.animationEnabled.walk" (ngModelChange)="cambiarHabilitadoAnim('walk', $event)"><option [ngValue]="true">Sí</option><option [ngValue]="false">No</option></select></div>
      <div class="field"><label>Jump Loop</label><select [ngModel]="playerConfig.animationEnabled.jumpLoop" (ngModelChange)="cambiarHabilitadoAnim('jumpLoop', $event)"><option [ngValue]="true">Sí</option><option [ngValue]="false">No</option></select></div>
      <div class="field"><label>Climb Up</label><select [ngModel]="playerConfig.animationEnabled.climbUp" (ngModelChange)="cambiarHabilitadoAnim('climbUp', $event)"><option [ngValue]="true">Sí</option><option [ngValue]="false">No</option></select></div>
    </div>
  </div>
</div>
