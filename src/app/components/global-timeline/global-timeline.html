

<div class="timeline-shell">
  <div class="timeline-tabs">
    <button class="tab-btn" [class.active]="activeTab === 'clips'" (click)="cambiarTab('clips')">🎬 Clips/Objetos</button>
    <button class="tab-btn" [class.active]="activeTab === 'animaciones'" (click)="cambiarTab('animaciones')">🏃 Anim. Auto</button>
    <button class="tab-btn" [class.active]="activeTab === 'director'" (click)="cambiarTab('director')">🎥 Director (Global)</button>
    <button class="tab-btn" [class.active]="activeTab === 'prefabs'" (click)="cambiarTab('prefabs')">📦 Prefabs</button>
    <button class="tab-btn" [class.active]="activeTab === 'plataforma'" (click)="cambiarTab('plataforma')" style="margin-left: auto; border-left: 1px solid #111;">🗺️ Lógica Plataforma</button>
  </div>

  <div class="timeline-content">
     <app-timeline-clips-tab *ngIf="activeTab === 'clips'"></app-timeline-clips-tab>
     <app-timeline-auto-anim-tab *ngIf="activeTab === 'animaciones'"></app-timeline-auto-anim-tab>
     <app-timeline-director-tab *ngIf="activeTab === 'director'"></app-timeline-director-tab>
     <app-timeline-prefabs-tab *ngIf="activeTab === 'prefabs'"></app-timeline-prefabs-tab>
     <app-timeline-platform-tab *ngIf="activeTab === 'plataforma'"></app-timeline-platform-tab>
  </div>
</div>
