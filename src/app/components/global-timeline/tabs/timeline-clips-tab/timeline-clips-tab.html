<div *ngIf="!stateSvc.objetoSeleccionado()" class="empty-state">
  <p>Selecciona un objeto para editar sus Clips/Secuencias.</p>
</div>

<div *ngIf="stateSvc.objetoSeleccionado()" style="display: flex; flex-direction: column; height: 100%;">
  <div class="clip-topbar">
    <button class="btn-primary" (click)="nuevaSecuencia()">+ Nuevo Clip</button>
    <div style="width: 1px; height: 15px; background: #444; margin: 0 4px;"></div>
    <button *ngFor="let seq of sequences" class="sequence-chip" [class.active]="seq.id === selectedSequenceId" (click)="seleccionarSecuencia(seq.id)">
      🎬 {{ seq.name }}
    </button>
  </div>
  
  <div *ngIf="currentSequence" style="flex: 1; display: flex; flex-direction: column; min-height: 0;">
    <div class="sequence-settings">
      <div class="field" style="width: 180px;"><input type="text" [(ngModel)]="currentSequence.name" (ngModelChange)="persist()"></div>
      <div class="checkbox-field highlight"><input type="checkbox" id="chkAutoPlay" [(ngModel)]="currentSequence.autoPlay" (ngModelChange)="persist()"><label for="chkAutoPlay">Auto-Play (Test Live / Juego)</label></div>
      <div class="checkbox-field"><input type="checkbox" id="chkRepeat" [(ngModel)]="currentSequence.repeat" (ngModelChange)="persist()"><label for="chkRepeat">Bucle Infinito</label></div>
      <div style="flex: 1;"></div>
      
      <!-- CONTROLES DE TRANSPORTE Y SCRUBBING EN ESCENA -->
      <div style="display: flex; align-items: center; gap: 8px; background: #161616; padding: 4px 10px; border-radius: 4px; border: 1px solid #333;">
        <button class="btn-secondary small" (click)="togglePlayPreview(currentSequence)" *ngIf="!esTrigger">
          {{ previewSvc.isPlayingPreview() ? '⏸ Pausa' : '▶ Play Preview' }}
        </button>
        <button class="btn-ghost small" (click)="stopPreview()" *ngIf="!esTrigger">⏹ Stop</button>
        
        <span style="font-family: monospace; font-size: 11px; color: #fbbf24; min-width: 90px; text-align: right;">
          {{ (currentTimeMs / 1000) | number:'1.2-2' }}s / {{ (totalDurationMs / 1000) | number:'1.2-2' }}s
        </span>
        <input type="range" [min]="0" [max]="totalDurationMs" [value]="currentTimeMs" (input)="onScrubTime(+$any($event.target).value)" style="width: 120px; cursor: pointer; accent-color: #3b82f6;">
      </div>

      <button class="btn-danger" (click)="eliminarSecuencia(currentSequence.id)" title="Eliminar Clip">🗑️</button>
    </div>
    
    <div class="timeline-track">
      <ng-container *ngFor="let step of currentSequence.steps; let i = index">
        <div class="step-card" [class.active]="selectedStepIndex === i" (click)="selectedStepIndex = i">
          <div class="step-header">
            <span class="step-num">{{ i + 1 }}</span>
            <span class="step-title" [title]="getActionLabel(step.action)">{{ getActionLabel(step.action) }}</span>
            <button class="step-del" (click)="quitarPaso(currentSequence, i); $event.stopPropagation()">×</button>
          </div>
          <div class="step-info">
            <span *ngIf="step.loop" style="color: #60a5fa; font-weight: bold;">🔁 Loop</span>
            <span *ngIf="!step.loop"></span>
            <span>{{ step.durationMs / 1000 }}s</span>
          </div>
        </div>
        <div class="step-arrow" *ngIf="i < currentSequence.steps.length - 1">➔</div>
      </ng-container>
      <button class="add-step-btn" (click)="agregarPaso(currentSequence)">+ Acción</button>
    </div>

    <!-- CLIP EDITOR -->
    <div class="step-editor-panel" *ngIf="currentStep">
      <h4>Paso {{ selectedStepIndex + 1 }}: Configuración</h4>
      <div class="step-editor-grid">
        <div class="field wide">
          <label>Acción</label>
          <select [(ngModel)]="currentStep.action" (ngModelChange)="persist()">
             <option *ngFor="let act of actionRows" [ngValue]="act.key">{{ act.label }}</option>
          </select>
        </div>
        
        <ng-container *ngIf="currentStep.action === 'procMove' || currentStep.action === 'procRotate'">
           <div class="field"><label style="color:#60a5fa">X</label><input type="number" step="0.5" [(ngModel)]="currentStep.procX" (ngModelChange)="persist()"></div>
           <div class="field"><label style="color:#4ade80">Y</label><input type="number" step="0.5" [(ngModel)]="currentStep.procY" (ngModelChange)="persist()"></div>
           <div class="field"><label style="color:#f87171">Z</label><input type="number" step="0.5" [(ngModel)]="currentStep.procZ" (ngModelChange)="persist()"></div>
        </ng-container>

        <div class="field wide" *ngIf="availableClips.length > 0 && currentStep.action !== 'procMove' && currentStep.action !== 'procRotate' && currentStep.action !== 'stopBaked' && !esLuz">
          <label style="color: #60a5fa;">Forzar Clip 3D / Target TV:</label>
          <select [(ngModel)]="currentStep.clipOverride" (ngModelChange)="persist()">
            <option value="">-- Automático --</option>
            <option *ngFor="let clip of availableClips" [value]="clip">🎬 {{ clip }}</option>
          </select>
        </div>

        <div class="field"><label>Duración (ms)</label><input type="number" step="50" min="50" [(ngModel)]="currentStep.durationMs" (ngModelChange)="persist()"></div>
        <div class="field" *ngIf="currentStep.action !== 'procMove' && currentStep.action !== 'procRotate'"><label>Frecuencia / Speed</label><input type="number" step="0.1" [(ngModel)]="currentStep.speedRatio" (ngModelChange)="persist()"></div>
        
        <div class="field wide" *ngIf="esPersonaje"><label>Avanzar (Z)</label><input type="number" step="0.1" [(ngModel)]="currentStep.offsetForward" (ngModelChange)="persist()"></div>
        <div class="field wide" *ngIf="esPersonaje"><label>Elevar (Y)</label><input type="number" step="0.1" [(ngModel)]="currentStep.offsetY" (ngModelChange)="persist()"></div>
      </div>
      <div class="step-editor-grid" style="margin-top: 10px;">
          <div class="checkbox-field"><input type="checkbox" id="stepLoop" [(ngModel)]="currentStep.loop" (ngModelChange)="persist()"><label for="stepLoop">Bucle Animación</label></div>
          <div class="checkbox-field" *ngIf="esPersonaje"><input type="checkbox" id="stepLock" [(ngModel)]="currentStep.lockInput" (ngModelChange)="persist()"><label for="stepLock">Bloquear Jugador</label></div>
      </div>
    </div>
  </div>
</div>
