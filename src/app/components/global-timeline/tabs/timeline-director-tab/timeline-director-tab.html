
<div style="display: flex; flex-direction: column; height: 100%;">
  
  <div class="clip-topbar">
    <button class="btn-primary" (click)="nuevaCinematica()">+ Nueva Cinemática</button>
    <div style="width: 1px; height: 15px; background: #444; margin: 0 4px;"></div>
    <button *ngFor="let cin of cinematics" class="sequence-chip" [class.active]="cin.id === cinematicSvc.selectedCinematicId()" (click)="seleccionarCinematica(cin.id)">
      🎥 {{ cin.name }}
    </button>
  </div>

  <div class="director-layout" *ngIf="cinematicSvc.currentCinematic()">
    
    <div class="timeline-toolbar">
       <button class="btn-primary small" (click)="agregarTrack('camera')">+ 🎥 Cámara</button>
       <button class="btn-primary small" (click)="agregarTrack('actor')">+ 🧍 Actor</button>
       <button class="btn-primary small" (click)="agregarTrack('object')">+ 📦 Objeto</button>
       <button class="btn-primary small" (click)="agregarTrack('dialogue')">+ 💬 Diálogo</button>
       <button class="btn-primary small" (click)="agregarTrack('text')">+ 🔤 Texto</button>
       <button class="btn-primary small" (click)="agregarTrack('image')">+ 🖼️ Imagen</button>
       <button class="btn-primary small" (click)="agregarTrack('event')">+ ⚡ Evento</button>
       
       <div class="toolbar-divider"></div>
       <button class="btn-ghost small" (click)="zoomOut()" title="Alejar (Zoom Out)">➖</button>
       <button class="btn-ghost small" (click)="zoomIn()" title="Acercar (Zoom In)">➕</button>
       <button class="btn-ghost small" (click)="fitTimeline()" title="Ajustar (Fit)">↔️ Fit</button>
       
       <div style="flex: 1;"></div>
       <span style="font-family: monospace; color: #fbbf24; font-size: 13px; font-weight: bold; margin-right: 15px;">
         {{ formatTime(playbackManager.playheadMs()) }} / {{ formatTime(cinematicSvc.currentCinematic()!.durationMs) }}
       </span>
       <button class="btn-secondary" (click)="togglePlayCinematic()">{{ playbackManager.isPlaying() ? '⏸ Pausar' : '▶ Reproducir' }}</button>
       <button class="btn-ghost" (click)="stopCinematic()">⏹ Detener</button>
    </div>

    <!-- ÁREA CON SCROLL GLOBAL -->
    <div class="timeline-scroll-wrapper" #scrollWrapper 
         (scroll)="onScroll()"
         (mousedown)="onScrollWrapperMouseDown($event)"
         (wheel)="onScrollWrapperWheel($event)">
       
       <!-- HEADER ROW (Regla de tiempo) -->
       <div class="timeline-row header">
          <div class="track-header-cell">
             <span style="font-size: 10px; color: #888; font-weight: bold; text-transform: uppercase;">Pistas</span>
          </div>
          <div class="track-content-cell timeline-ruler" 
               [style.width.px]="timelineWidth"
               (mousedown)="onTimelineMouseDown($event)">
               
               <div class="ruler-marks">
                  <span *ngFor="let mark of getTimelineMarks()" 
                        class="ruler-mark" [style.left.px]="timeToPx(mark)">
                     {{ formatTimeShort(mark) }}
                  </span>
               </div>
               
               <div class="playhead-line" [style.left.px]="timeToPx(playbackManager.playheadMs())"></div>
          </div>
       </div>

       <!-- TRACK ROWS -->
       <div class="timeline-row track" *ngFor="let track of cinematicSvc.currentCinematic()!.tracks; let tIdx = index" 
            [class.selected]="cinematicSvc.selectedTrackIndex() === tIdx" 
            (click)="seleccionarTrack(tIdx, $event)">
          
          <div class="track-header-cell">
             <div class="track-info">
                <span class="track-icon">{{ getTrackIcon(track.type) }}</span>
                <span class="track-name" [title]="track.name">{{ track.name }}</span>
             </div>
             <button class="btn-secondary small" style="padding:0 6px;" (click)="agregarKeyframe(track); $event.stopPropagation()">+ KF</button>
          </div>
          
          <div class="track-content-cell" [style.width.px]="timelineWidth">
             <!-- Linea fantasma del playhead para referencia visual -->
             <div class="playhead-line" style="background: rgba(239,68,68,0.3); z-index: 1;" [style.left.px]="timeToPx(playbackManager.playheadMs())"></div>
             
             <!-- Keyframes -->
             <div class="keyframe-point" 
                  *ngFor="let kf of track.keyframes"
                  [class.selected]="cinematicSvc.selectedTrackIndex() === tIdx && cinematicSvc.selectedKeyframeId() === kf.id"
                  (mousedown)="seleccionarKeyframe(tIdx, kf, $event)"
                  (click)="preventClickPropagation($event)"
                  [style.left.px]="timeToPx(kf.timeMs)">
                 <div class="keyframe-diamond"></div>

                 <!-- TEXT / IMAGE / OVERLAY DURATION BAR -->
                 <div class="duration-bar overlay-bar" 
                      *ngIf="(track.type === 'text' || track.type === 'image' || track.type === 'overlay') && kf.value?.durationMs"
                      [style.width.px]="timeToPx(kf.value.durationMs)">
                    {{ kf.value.title || (kf.value.image ? 'Imagen' : 'Texto') }}
                 </div>

                 <!-- DIALOGUE DURATION BAR -->
                 <div class="duration-bar dialogue-bar" 
                      *ngIf="track.type === 'dialogue' && kf.value?.durationMs"
                      [style.width.px]="timeToPx(kf.value.durationMs)">
                    💬 {{ kf.value.actorName || '...' }}
                 </div>
             </div>
          </div>
          
       </div>
       
    </div>
  </div>
</div>
