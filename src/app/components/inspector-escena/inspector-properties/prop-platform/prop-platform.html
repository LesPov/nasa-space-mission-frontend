
<div class="section-card">
  <div class="section-head">
    <h4>Identidad de la Plataforma</h4>
  </div>
  <div style="padding: 12px;">
    <div class="field wide">
      <label>Nombre Local (Zona / Escena)</label>
      <input type="text" [(ngModel)]="sceneName" (ngModelChange)="aplicarNombre()" placeholder="Ej: Laboratorio Subterráneo" />
    </div>
    <p class="help-text" style="margin-top: 8px;">
      Nombre con el que esta sección del mapa se conectará a través de puertas.
    </p>
  </div>
</div>

<div class="section-card">
  <div class="section-head">
    <h4>Físicas y Gravedad Local</h4>
  </div>
  <div style="padding: 12px;">
    <div class="field wide" style="margin-bottom: 12px;">
      <label>Preset de Gravedad</label>
      <select [(ngModel)]="gravityPreset" (ngModelChange)="onGravityPresetChange()">
        <option value="earth">🌍 Tierra (9.81 m/s²)</option>
        <option value="mars">🔴 Marte (3.71 m/s²)</option>
        <option value="moon">🌕 Luna (1.62 m/s²)</option>
        <option value="zero_g">🚀 Espacio / 0G (0.00 m/s²)</option>
        <option value="custom">⚙️ Personalizada</option>
      </select>
    </div>

    <div class="grid-2" style="margin-bottom: 12px;">
      <div class="field">
        <label>Magnitud (m/s²)</label>
        <input type="number" step="0.1" min="0" max="100" 
               [(ngModel)]="gravityMagnitude" 
               [disabled]="gravityPreset !== 'custom'"
               (ngModelChange)="aplicarGravedadCustom()" />
      </div>
      <div class="field">
        <label>Escala Interna (Y)</label>
        <input type="number" step="0.01" [(ngModel)]="gravedadY" readonly style="opacity: 0.5;" />
      </div>
    </div>

    <div class="section-mini-head" *ngIf="gravityPreset === 'custom'">
      <h5>Vector de Dirección Local</h5>
    </div>
    <div class="grid-3" *ngIf="gravityPreset === 'custom'">
      <div class="field"><label>Dir X</label><input type="number" step="0.1" [(ngModel)]="gravityDirX" (ngModelChange)="aplicarGravedadCustom()" /></div>
      <div class="field"><label>Dir Y</label><input type="number" step="0.1" [(ngModel)]="gravityDirY" (ngModelChange)="aplicarGravedadCustom()" /></div>
      <div class="field"><label>Dir Z</label><input type="number" step="0.1" [(ngModel)]="gravityDirZ" (ngModelChange)="aplicarGravedadCustom()" /></div>
    </div>
  </div>
</div>

<div class="section-card">
  <div class="section-head">
    <h4>Variables Iniciales (Spawn)</h4>
  </div>
  <div style="padding: 12px;">
    <p class="help-text" style="margin-bottom: 12px;">
      Variables en memoria que se setean automáticamente al entrar a esta zona.
    </p>
    
    <div class="grid-2" *ngFor="let cond of initialVariables; let i = index" style="margin-bottom: 8px;">
      <div class="field"><input type="text" [(ngModel)]="cond.key" (ngModelChange)="persistPlatformLogic()" placeholder="Clave (Ej: status)" /></div>
      <div style="display: flex; gap: 4px;">
        <input type="text" [(ngModel)]="cond.value" (ngModelChange)="persistPlatformLogic()" placeholder="Valor (Ej: true)" style="flex: 1;" class="modal-input" />
        <button class="btn-danger small" (click)="quitarVariableInicial(i)">✕</button>
      </div>
    </div>
    
    <button class="btn-secondary full" style="margin-top: 10px;" (click)="agregarVariableInicial()">+ Agregar Variable Local</button>
  </div>
</div>
