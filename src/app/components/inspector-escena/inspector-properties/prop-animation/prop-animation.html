
<div class="section-card">
  <div class="section-head">
    <h4>1. Probar Animaciones</h4>
    <button class="btn-ghost small" (click)="detenerAnimaciones()">⏹ Detener</button>
  </div>

  <div class="tool-row">
    <input type="text" [(ngModel)]="clipFilter" placeholder="Buscar animación..." class="search-input" />
  </div>

  <div class="clip-list">
    <div *ngFor="let clip of animationClipsFiltradas" class="clip-card" [class.playing]="clip.playing">
      <div class="clip-name" [title]="clip.name">🎬 {{ clip.name }}</div>
      <button class="btn-primary small" (click)="reproducirAnimacion(clip.group)">▶ Probar</button>
    </div>
    
    <div *ngIf="animationClipsFiltradas.length === 0" style="color: #64748b; font-size: 11px; text-align: center; padding: 10px;">
      Este modelo 3D no tiene animaciones incrustadas.
    </div>
  </div>
</div>

<div class="section-card">
  <div class="section-head">
    <h4>2. Asignar Acciones</h4>
    <button class="btn-secondary small" (click)="detectarBindingsAutomaticamente()">✨ Auto-detectar</button>
  </div>

  <div class="binding-list" style="margin-top: 12px;">
    <div class="accordion-section expanded" *ngFor="let action of actionRows" style="margin-bottom: 8px;">
      <div class="accordion-header" style="cursor: default;">
        <h4>{{ action.label }}</h4>
        <span class="status-pill" [class.vacío]="actionBadge(action.key) === 'vacío'">{{ actionBadge(action.key) }}</span>
      </div>
      
      <div class="accordion-content">
        <div class="field wide">
          <input type="text" [(ngModel)]="bindingInputs[action.key]" placeholder="Escribe nombre de animación y pulsa Enter..." (keydown.enter)="agregarBinding(action.key)" />
          <div class="token-row" *ngIf="bindingTokens[action.key]?.length">
            <span class="token" *ngFor="let token of bindingTokens[action.key]; let i = index">
              {{ token }}
              <button type="button" (click)="quitarBinding(action.key, i)">✕</button>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="status-line" *ngIf="animStatus">{{ animStatus }}</div>
