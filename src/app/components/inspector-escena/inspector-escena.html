<div class="inspector-shell">
  
  <!-- PANEL SUPERIOR: OUTLINER (Lista de objetos) -->
  <app-inspector-outliner (tabSelect)="activeTab = $event"></app-inspector-outliner>
  
  <!-- PANEL INFERIOR: PROPERTIES (Lógica y físicas) -->
  <app-inspector-properties 
    [pestanaActiva]="activeTab" 
    (pestanaActivaChange)="activeTab = $event">
  </app-inspector-properties>

</div>
